<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button Counter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      min-height: 100vh;
      padding: 2rem;
    }

    h1 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 2rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #fff;
    }

    .buttons-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.2rem;
      max-width: 900px;
      margin: 0 auto 3rem;
    }

    .btn-card {
      background: #1a1a1a;
      border: 2px solid #333;
      border-radius: 16px;
      padding: 1.25rem 1rem 1rem;
      text-align: center;
      user-select: none;
    }

    .btn-card.flash {
      border-color: #7c3aed;
      background: #2d1b69;
      transition: border-color 0.05s, background 0.05s;
    }

    .btn-name {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #a78bfa;
      margin-bottom: 0.25rem;
    }

    .btn-quote {
      font-size: 0.95rem;
      font-weight: 600;
      color: #ccc;
      margin-bottom: 0.75rem;
      line-height: 1.3;
    }

    .btn-count {
      font-size: 2.8rem;
      font-weight: 800;
      color: #fff;
      line-height: 1;
      margin-bottom: 0.75rem;
    }

    .btn-controls {
      display: flex;
      justify-content: center;
      gap: 0.6rem;
    }

    .ctrl-btn {
      width: 2.4rem;
      height: 2.4rem;
      border-radius: 50%;
      border: 2px solid #444;
      background: #111;
      color: #f0f0f0;
      font-size: 1.3rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s, border-color 0.12s, transform 0.08s;
      line-height: 1;
    }

    .ctrl-btn:hover {
      border-color: #666;
      background: #222;
    }

    .ctrl-btn:active {
      transform: scale(0.88);
    }

    .ctrl-btn.plus:hover  { border-color: #7c3aed; color: #a78bfa; }
    .ctrl-btn.minus:hover { border-color: #555; color: #888; }

    /* Leaderboard */
    .leaderboard {
      max-width: 500px;
      margin: 0 auto;
    }

    .leaderboard h2 {
      text-align: center;
      font-size: 1.3rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 1rem;
    }

    .lb-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      margin-bottom: 0.5rem;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
    }

    .lb-rank {
      font-size: 1.1rem;
      font-weight: 800;
      width: 2rem;
      text-align: center;
      color: #555;
    }

    .lb-rank.gold   { color: #fbbf24; }
    .lb-rank.silver { color: #94a3b8; }
    .lb-rank.bronze { color: #b45309; }

    .lb-name { flex: 1; font-size: 0.95rem; font-weight: 600; }
    .lb-name span { display: block; font-size: 0.75rem; color: #888; font-weight: 400; }

    .lb-count {
      font-size: 1.2rem;
      font-weight: 800;
      color: #a78bfa;
    }

    .lb-bar-wrap {
      width: 100%;
      height: 4px;
      background: #2a2a2a;
      border-radius: 2px;
      margin-top: 0.3rem;
      overflow: hidden;
    }

    .lb-bar {
      height: 100%;
      background: #7c3aed;
      border-radius: 2px;
      transition: width 0.4s ease;
    }
  </style>
</head>
<body>

<h1>Button Counter</h1>

<div class="buttons-grid" id="buttons-grid"></div>

<div class="leaderboard">
  <h2>Leaderboard</h2>
  <div id="leaderboard"></div>
</div>

<script>
  const BUTTONS = [
    { id: 'b1', name: 'Elad',    quote: "Let's Get Shots" },
    { id: 'b2', name: 'Elliot',  quote: "My Knees Hurt" },
    { id: 'b3', name: 'Kate',    quote: "We Gotta Lay Eyes" },
    { id: 'b4', name: 'Katelyn', quote: "Should we get a bottle?" },
    { id: 'b5', name: 'Matt',    quote: "And I've Always Said That" },
    { id: 'b6', name: 'Tomasz',  quote: "Unsolicited Fun Fact" },
  ];

  function loadState() {
    try { return JSON.parse(localStorage.getItem('btnCounterState2')) || {}; }
    catch { return {}; }
  }

  function saveState(s) {
    localStorage.setItem('btnCounterState2', JSON.stringify(s));
  }

  const saved = loadState();
  const buttons = BUTTONS.map(b => ({ ...b, count: saved[b.id] ?? 0 }));

  function persist() {
    const s = {};
    buttons.forEach(b => { s[b.id] = b.count; });
    saveState(s);
  }

  function renderLeaderboard() {
    const sorted = [...buttons].sort((a, b) => b.count - a.count);
    const max = sorted[0]?.count || 1;
    const rankClass = ['gold', 'silver', 'bronze'];
    document.getElementById('leaderboard').innerHTML = sorted.map((b, i) => {
      const pct = max > 0 ? (b.count / max * 100).toFixed(1) : 0;
      return `
        <div class="lb-row">
          <div class="lb-rank ${rankClass[i] || ''}">${i + 1}</div>
          <div style="flex:1">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <div class="lb-name">${b.name}<span>${b.quote}</span></div>
              <span class="lb-count">${b.count.toLocaleString()}</span>
            </div>
            <div class="lb-bar-wrap"><div class="lb-bar" style="width:${pct}%"></div></div>
          </div>
        </div>`;
    }).join('');
  }

  function buildButtons() {
    const grid = document.getElementById('buttons-grid');
    grid.innerHTML = '';

    buttons.forEach(b => {
      const card = document.createElement('div');
      card.className = 'btn-card';

      const name = document.createElement('div');
      name.className = 'btn-name';
      name.textContent = b.name;

      const quote = document.createElement('div');
      quote.className = 'btn-quote';
      quote.textContent = `"${b.quote}"`;

      const count = document.createElement('div');
      count.className = 'btn-count';
      count.textContent = b.count.toLocaleString();

      const controls = document.createElement('div');
      controls.className = 'btn-controls';

      const minus = document.createElement('button');
      minus.className = 'ctrl-btn minus';
      minus.textContent = '−';
      minus.addEventListener('click', () => {
        if (b.count > 0) b.count--;
        count.textContent = b.count.toLocaleString();
        persist();
        renderLeaderboard();
      });

      const plus = document.createElement('button');
      plus.className = 'ctrl-btn plus';
      plus.textContent = '+';
      plus.addEventListener('click', () => {
        b.count++;
        count.textContent = b.count.toLocaleString();
        card.classList.add('flash');
        setTimeout(() => card.classList.remove('flash'), 200);
        persist();
        renderLeaderboard();
      });

      controls.appendChild(minus);
      controls.appendChild(plus);

      card.appendChild(name);
      card.appendChild(quote);
      card.appendChild(count);
      card.appendChild(controls);

      grid.appendChild(card);
    });
  }

  buildButtons();
  renderLeaderboard();
</script>
</body>
</html>
